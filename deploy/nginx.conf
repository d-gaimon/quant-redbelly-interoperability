# nginx site for a VPS. Copy to /etc/nginx/sites-available/overledger-research,
# set server_name and root, then follow deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name research.example.org;

    root /var/www/quant-redbelly-interoperability/site;
    index index.html;
    charset utf-8;

    # The site is static: one page, its assets and the downloadable files.
    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/overledger-research-headers.conf;
    }

    location /downloads/ {
        add_header Content-Disposition "attachment";
        include /etc/nginx/snippets/overledger-research-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript text/markdown text/csv text/plain application/json image/svg+xml;

    include /etc/nginx/snippets/overledger-research-headers.conf;

    # Nothing outside site/ is served, and hidden files never are.
    location ~ /\. { deny all; }
}
